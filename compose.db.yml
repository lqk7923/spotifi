services:
  postgres:
    image: postgres:18
    container_name: spotify_clone_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-spotify_clone_db}
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: